<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="vendorLogoTitle">
  <title id="vendorLogoTitle">Biruwa Vendor Portal</title>

  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Outer ring: marks this as a portal / seal, distinct from the primary wordmark logo -->
  <circle cx="80" cy="80" r="74" fill="#ffffff"/>
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  <circle cx="80" cy="80" r="66" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.7"/>

  <!-- Pot -->
  <path d="M56 96 L104 96 L98 132 Q97 138 91 138 L69 138 Q63 138 62 132 Z" fill="url(#potGrad)"/>
  <rect x="52" y="88" width="56" height="11" rx="4" fill="#92400e"/>

  <!-- Leaves growing from the pot -->
  <path d="M80 90 C80 66 66 52 48 46 C46 68 58 84 80 90Z" fill="url(#leafGrad)"/>
  <path d="M80 90 C80 62 96 46 116 40 C119 64 106 82 80 90Z" fill="url(#leafGrad)" opacity="0.92"/>
  <path d="M80 90 C79 58 80 42 80 30 C90 40 92 62 84 90Z" fill="#4ade80"/>
  <path d="M80 30 C80 42 79 58 80 90" stroke="#166534" stroke-width="1.4" fill="none" opacity="0.6"/>

  <!-- Small vendor badge / ribbon, the distinguishing "seller" mark -->
  <circle cx="118" cy="112" r="19" fill="#ffffff" stroke="url(#ringGrad)" stroke-width="3"/>
  <path d="M110 112.5 L115.5 118 L127 105" stroke="#166534" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
